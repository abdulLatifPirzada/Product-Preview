<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">

  <title>Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->

</head>

<body>

  <div class="container">
    <div class="image">
      <picture>
        <source media="(max-width: 767px)" srcset="/images/image-product-mobile.jpg">
        <img src="/images/image-product-desktop.jpg" alt="product image">
        <source media="(min-width: 768px)" srcset="/images/image-product-desktop.jpg">
      </picture>

    </div>
    <div class="product-info">

      <p class="brand">PERFUME</p>


      <h1>Gabrielle Essence Eau De Parfum</h1>


      <p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.</p>
       <div class="prices"> 
       <p class="price">$149.99</p>
      <p class="old-price">$169.99</p>
       </div>
      
       
        <button class="add-to-cart">
          <img class="cart-icon" src="/images/icon-cart.svg" alt="cart icon">
          Add to Cart
        </button>
     
      
    </div>

  </div>


  <!-- Perfume

  Gabrielle Essence Eau De Parfum

  A floral, solar and voluptuous interpretation composed by Olivier Polge, 
  Perfumer-Creator for the House of CHANEL.

  $149.99
  $169.99

  Add to Cart -->


  
</body>

</html>
